<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">6-PUS 分层控制架构与未来任务空间接口</title>
  <desc id="desc">主体深灰实线表示已完成或已验证链路，上部灰色虚线外框界定未来区域，蓝色虚线箭头表示未来任务空间反馈链路。</desc>
  <defs>
    <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#202733}.h{font-size:24px;font-weight:700}.m{font-size:17px;font-weight:600}.s{font-size:14px;fill:#526071}.box{fill:#fff;stroke:#3d4652;stroke-width:2.2}.blue{fill:#eef4ff;stroke:#2563eb;stroke-width:2.2}.green{fill:#f1f8f5;stroke:#16866a;stroke-width:2.2}.orange{fill:#fff8ec;stroke:#cf7200;stroke-width:2.2}.line{stroke:#3d4652;stroke-width:2.3;fill:none}.fb{stroke:#16866a;stroke-width:2.3;fill:none}.future-frame{fill:#fbfcfd;stroke:#9ba8b9;stroke-width:2;stroke-dasharray:8 6}.future{fill:#f8fbff;stroke:#82add8;stroke-width:2;stroke-dasharray:8 6}.fline{stroke:#4f8dcc;stroke-width:2.2;stroke-dasharray:8 6;fill:none}</style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#3d4652"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#16866a"/></marker>
    <marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#82add8"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#fff"/>
  <text class="t h" x="600" y="36" text-anchor="middle">6-PUS 分层控制架构与任务空间接口</text>
  <rect class="future-frame" x="32" y="65" width="1136" height="170" rx="6"/>
  <text class="t m" x="55" y="92" fill="#557fa8">未来任务空间反馈外环（可选接口）</text>
  <rect class="future" x="85" y="126" width="190" height="60" rx="4"/>
  <text class="t m" x="180" y="151" text-anchor="middle" fill="#557fa8">平台位姿测量</text><text class="t s" x="180" y="173" text-anchor="middle">TWP</text>
  <path class="fline" d="M275 156H382" marker-end="url(#f)"/>
  <rect class="future" x="390" y="116" width="230" height="80" rx="4"/>
  <text class="t m" x="505" y="147" text-anchor="middle" fill="#557fa8">任务空间反馈补偿器</text><text class="t s" x="505" y="173" text-anchor="middle">消除前馈后的残余位姿误差</text>
  <path class="fline" d="M620 156H727" marker-end="url(#f)"/>
  <rect class="future" x="735" y="126" width="180" height="60" rx="4"/>
  <text class="t m" x="825" y="151" text-anchor="middle" fill="#557fa8">外环修正 ΔT</text><text class="t s" x="825" y="173" text-anchor="middle">叠加至任务空间指令</text>
  <text class="t m" x="32" y="276">本阶段已完成 / 已验证</text>
  <rect x="32" y="292" width="1136" height="340" rx="6" fill="#fff" stroke="#16866a" stroke-width="2.4"/>
  <rect class="box" x="60" y="350" width="140" height="74" rx="4"/><text class="t m" x="130" y="381" text-anchor="middle">世界系目标</text><text class="t s" x="130" y="406" text-anchor="middle">TWP,des</text>
  <path class="line" d="M200 387H250" marker-end="url(#a)"/>
  <rect class="blue" x="258" y="335" width="205" height="104" rx="4"/><text class="t m" x="360" y="369" text-anchor="middle">刚体运动学补偿</text><text class="t s" x="360" y="395" text-anchor="middle">TBP,cmd = TWB⁻¹TWP,des</text><text class="t s" x="360" y="418" text-anchor="middle">前馈几何关系已验证</text>
  <path class="line" d="M463 387H513" marker-end="url(#a)"/>
  <rect class="blue" x="521" y="350" width="165" height="74" rx="4"/><text class="t m" x="603" y="381" text-anchor="middle">解析逆运动学</text><text class="t s" x="603" y="406" text-anchor="middle">qdes(1…6)</text>
  <path class="line" d="M686 387H736" marker-end="url(#a)"/>
  <rect class="green" x="744" y="335" width="195" height="104" rx="4"/><text class="t m" x="841" y="369" text-anchor="middle">执行器位置内环</text><text class="t s" x="841" y="395" text-anchor="middle">PI-D 或 MIMO-LADRC</text><text class="t s" x="841" y="418" text-anchor="middle">输出六通道推力 F</text>
  <path class="line" d="M939 387H989" marker-end="url(#a)"/>
  <rect class="orange" x="997" y="335" width="140" height="104" rx="4"/><text class="t m" x="1067" y="369" text-anchor="middle">6-PUS</text><text class="t s" x="1067" y="395" text-anchor="middle">多体被控对象</text><text class="t s" x="1067" y="418" text-anchor="middle">力驱动</text>
  <rect class="box" x="744" y="516" width="393" height="72" rx="4"/><text class="t m" x="940" y="545" text-anchor="middle">关节与平台测量</text><text class="t s" x="940" y="570" text-anchor="middle">qmeas、q̇meas、Transform Sensor 位姿</text>
  <path class="line" d="M1067 439V508" marker-end="url(#a)"/>
  <path class="fb" d="M820 516V439" marker-end="url(#g)"/><text class="t s" x="790" y="480" text-anchor="end" fill="#16866a">关节位置 / 速度反馈</text>
  <path class="fline" d="M1110 516V470H1145V108H180V126" marker-end="url(#f)"/>
  <path class="fline" d="M825 186V255H360V335" marker-end="url(#f)"/>
  <text class="t s" x="600" y="660" text-anchor="middle">深灰实线：已验证链路　　灰色虚线外框：未来区域　　蓝色虚线箭头：未来可接入外环。</text>
</svg>
