<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">参数化简化 6-PUS 多体拓扑</title><desc id="desc">世界坐标系固定定平台，六条对称 P-U-S 支链连接动平台，位姿传感器独立测量动平台。</desc>
<defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#202733}.h{font-size:24px;font-weight:700}.m{font-size:18px;font-weight:600}.s{font-size:15px;fill:#526071}.line{stroke:#3d4652;stroke-width:2.4;fill:none}.green{stroke:#16866a}.joint{fill:#fff;stroke:#3d4652;stroke-width:2.2}.platform{fill:#f8fafc;stroke:#3d4652;stroke-width:2.6}.accent{fill:#eef4ff;stroke:#2563eb;stroke-width:2.4}.sensor{fill:#f1f8f5;stroke:#16866a;stroke-width:2.4}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#3d4652"/></marker><marker id="garr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#16866a"/></marker></defs>
<rect width="1200" height="680" fill="#fff"/><text class="t h" x="600" y="38" text-anchor="middle">参数化简化 6-PUS 多体拓扑</text>
