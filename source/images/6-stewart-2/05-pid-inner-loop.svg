<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PI-D 执行器位置内环单通道结构</title>
  <desc id="desc">位置误差进入比例与积分通道，测量速度经负反馈阻尼通道进入主求和点；限幅输出与未限幅输出之差经反算增益回送积分器输入。</desc>
  <defs>
    <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#202733}.h{font-size:25px;font-weight:700}.m{font-size:17px;font-weight:600}.s{font-size:14px;fill:#526071}.box{fill:#fff;stroke:#3d4652;stroke-width:2.2}.blue{fill:#eef4ff;stroke:#2563eb;stroke-width:2.2}.green{fill:#f1f8f5;stroke:#16866a;stroke-width:2.2}.orange{fill:#fff8ec;stroke:#cf7200;stroke-width:2.2}.line{stroke:#3d4652;stroke-width:2.3;fill:none}.aw{stroke:#cf7200;stroke-width:2.3;fill:none;stroke-dasharray:7 5}</style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#3d4652"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#cf7200"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#fff"/>
  <text class="t h" x="640" y="40" text-anchor="middle">PI-D 执行器位置内环（单通道）</text>
  <rect class="box" x="34" y="116" width="150" height="68" rx="4"/>
  <text class="t m" x="109" y="144" text-anchor="middle">期望位移</text><text class="t s" x="109" y="168" text-anchor="middle">qdes,i</text>
  <circle cx="242" cy="150" r="24" fill="#fff" stroke="#3d4652" stroke-width="2.2"/>
  <text class="t m" x="242" y="156" text-anchor="middle">Σ</text><text class="t s" x="222" y="120">+</text><text class="t s" x="238" y="189">−</text>
  <path class="line" d="M184 150H213" marker-end="url(#a)"/><text class="t s" x="278" y="137">位置误差 eᵢ</text>
  <path class="line" d="M266 150H334V102H370" marker-end="url(#a)"/>
  <rect class="blue" x="378" y="70" width="142" height="64" rx="4"/><text class="t m" x="449" y="98" text-anchor="middle">比例 Kp</text><text class="t s" x="449" y="121" text-anchor="middle">Kp eᵢ</text>
  <path class="line" d="M334 150V242H370" marker-end="url(#a)"/>
  <rect class="blue" x="378" y="210" width="142" height="64" rx="4"/><text class="t m" x="449" y="238" text-anchor="middle">积分增益 Ki</text><text class="t s" x="449" y="261" text-anchor="middle">Ki eᵢ</text>
  <circle cx="580" cy="242" r="23" fill="#fff" stroke="#3d4652" stroke-width="2.2"/>
  <text class="t m" x="580" y="248" text-anchor="middle">Σ</text><text class="t s" x="559" y="213">+</text><text class="t s" x="576" y="280" fill="#cf7200">+</text>
  <path class="line" d="M520 242H552" marker-end="url(#a)"/><path class="line" d="M603 242H635" marker-end="url(#a)"/>
  <rect class="green" x="643" y="203" width="172" height="78" rx="4"/><text class="t m" x="729" y="234" text-anchor="middle">积分力状态</text><text class="t s" x="729" y="258" text-anchor="middle">∫ ḞI,i dt → FI,i</text>
  <circle cx="890" cy="150" r="25" fill="#fff" stroke="#3d4652" stroke-width="2.2"/>
  <text class="t m" x="890" y="156" text-anchor="middle">Σ</text><text class="t s" x="869" y="121">+</text><text class="t s" x="869" y="187">+</text><text class="t s" x="903" y="187">−</text>
  <path class="line" d="M520 102H865" marker-end="url(#a)"/><path class="line" d="M815 242H846V174H866" marker-end="url(#a)"/>
  <path class="line" d="M915 150H952" marker-end="url(#a)"/><text class="t s" x="950" y="128" text-anchor="end">Funsat,i</text>
  <rect class="orange" x="960" y="114" width="150" height="72" rx="4"/><text class="t m" x="1035" y="143" text-anchor="middle">推力限幅</text><text class="t s" x="1035" y="168" text-anchor="middle">±15 N</text>
  <path class="line" d="M1110 150H1187" marker-end="url(#a)"/><text class="t m" x="1198" y="156">Fcmd,i</text>
  <rect class="box" x="34" y="422" width="150" height="68" rx="4"/><text class="t m" x="109" y="450" text-anchor="middle">实测位移</text><text class="t s" x="109" y="474" text-anchor="middle">qmeas,i</text>
  <path class="line" d="M184 456H242V174" marker-end="url(#a)"/>
  <rect class="box" x="34" y="542" width="150" height="68" rx="4"/><text class="t m" x="109" y="570" text-anchor="middle">实测速度</text><text class="t s" x="109" y="594" text-anchor="middle">q̇meas,i</text>
  <path class="line" d="M184 576H370" marker-end="url(#a)"/>
  <rect class="blue" x="378" y="544" width="142" height="64" rx="4"/><text class="t m" x="449" y="572" text-anchor="middle">速度阻尼 Kd</text><text class="t s" x="449" y="595" text-anchor="middle">Kd q̇meas,i</text>
  <path class="line" d="M520 576H890V175" marker-end="url(#a)"/>
  <circle cx="940" cy="360" r="23" fill="#fff" stroke="#cf7200" stroke-width="2.2"/>
  <text class="t m" x="940" y="366" text-anchor="middle">Σ</text><text class="t s" x="936" y="329">−</text><text class="t s" x="969" y="365">+</text>
  <path class="aw" d="M1148 150V360H964" marker-end="url(#o)"/><path class="aw" d="M935 150V328" marker-end="url(#o)"/>
  <rect class="orange" x="643" y="327" width="172" height="66" rx="4"/><text class="t m" x="729" y="355" text-anchor="middle">反算增益 Kaw</text><text class="t s" x="729" y="378" text-anchor="middle">20 s⁻¹</text>
  <path class="aw" d="M917 360H823" marker-end="url(#o)"/><path class="aw" d="M643 360H580V266" marker-end="url(#o)"/>
  <text class="t s" x="940" y="410" text-anchor="middle" fill="#a75b00">ΔFᵢ = Fcmd,i − Funsat,i</text>
  <text class="t s" x="640" y="684" text-anchor="middle">P、I 处理位置误差；速度阻尼通道进入负号端；饱和差值经 Kaw 回送积分器输入。</text>
</svg>
