<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">规定运动与力驱动闭环的因果关系对比</title><desc id="desc">上方为规定运动形成的几何约束链，下方为推力驱动的动力学反馈闭环。</desc><defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#202733}.h{font-size:24px;font-weight:700}.m{font-size:18px;font-weight:600}.s{font-size:14px;fill:#526071}.box{fill:#fff;stroke:#3d4652;stroke-width:2.2}.blue{fill:#eef4ff;stroke:#2563eb;stroke-width:2.2}.green{fill:#f1f8f5;stroke:#16866a;stroke-width:2.2}.orange{fill:#fff8ec;stroke:#cf7200;stroke-width:2.2}.line{stroke:#3d4652;stroke-width:2.3;fill:none}.fb{stroke:#16866a;stroke-width:2.3;fill:none}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#3d4652"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#16866a"/></marker></defs><rect width="1200" height="650" fill="#fff"/><text class="t h" x="600" y="38" text-anchor="middle">规定运动与力驱动：两种物理因果关系</text><text class="t m" x="35" y="91">A　规定运动（Prescribed Motion）</text><text class="t s" x="1165" y="91" text-anchor="end">几何一致性验证</text><rect x="25" y="108" width="1150" height="190" rx="5" fill="#fafbfc" stroke="#c7ced8" stroke-width="2"/><rect class="box" x="60" y="158" width="175" height="76" rx="4"/><text class="t m" x="147" y="190" text-anchor="middle">目标位姿</text><text class="t s" x="147" y="216" text-anchor="middle">x, y, z, α, β, γ</text><path class="line" d="M235 196H302" marker-end="url(#a)"/><rect class="blue" x="310" y="158" width="190" height="76" rx="4"/><text class="t m" x="405" y="190" text-anchor="middle">解析逆运动学</text><text class="t s" x="405" y="216" text-anchor="middle">qdes(1…6)</text><path class="line" d="M500 196H567" marker-end="url(#a)"/><rect class="orange" x="575" y="145" width="245" height="102" rx="4"/><text class="t m" x="697" y="181" text-anchor="middle">P Joint：Motion by Input</text><text class="t s" x="697" y="208" text-anchor="middle">轨迹作为强几何约束</text><text class="t s" x="697" y="229" text-anchor="middle">约束反力由求解器反算</text><path class="line" d="M820 196H887" marker-end="url(#a)"/><rect class="box" x="895" y="158" width="225" height="76" rx="4"/><text class="t m" x="1007" y="190" text-anchor="middle">多体几何与位姿</text><text class="t s" x="1007" y="216" text-anchor="middle">无执行器动力学闭环</text><text class="t m" x="35" y="354">B　力驱动（Force Actuation）</text><text class="t s" x="1165" y="354" text-anchor="end">动力学与控制验证</text><rect x="25" y="371" width="1150" height="250" rx="5" fill="#fafbfc" stroke="#c7ced8" stroke-width="2"/><rect class="box" x="55" y="421" width="155" height="74" rx="4"/><text class="t m" x="132" y="452" text-anchor="middle">期望位移</text><text class="t s" x="132" y="477" text-anchor="middle">qdes</text><circle cx="267" cy="458" r="23" fill="#fff" stroke="#3d4652" stroke-width="2.2"/><text class="t m" x="267" y="465" text-anchor="middle">Σ</text><text class="t s" x="247" y="429">+</text><text class="t s" x="262" y="493">−</text><path class="line" d="M210 458H242" marker-end="url(#a)"/><path class="line" d="M290 458H342" marker-end="url(#a)"/><rect class="blue" x="350" y="421" width="170" height="74" rx="4"/><text class="t m" x="435" y="452" text-anchor="middle">PID / ADRC</text><text class="t s" x="435" y="477" text-anchor="middle">输出推力 F</text><path class="line" d="M520 458H572" marker-end="url(#a)"/><rect class="green" x="580" y="421" width="170" height="74" rx="4"/><text class="t m" x="665" y="452" text-anchor="middle">P Joint</text><text class="t s" x="665" y="477" text-anchor="middle">Force by Input</text><path class="line" d="M750 458H802" marker-end="url(#a)"/><rect class="orange" x="810" y="408" width="215" height="100" rx="4"/><text class="t m" x="917" y="443" text-anchor="middle">6-PUS 多体动力学</text><text class="t s" x="917" y="469" text-anchor="middle">惯性 · 重力 · 支链耦合</text><text class="t s" x="917" y="490" text-anchor="middle">正向动力学决定运动</text><path class="line" d="M1025 458H1082" marker-end="url(#a)"/><rect class="box" x="1088" y="421" width="72" height="74" rx="4"/><text class="t m" x="1124" y="452" text-anchor="middle">q</text><text class="t s" x="1124" y="477" text-anchor="middle">q̇</text><path class="fb" d="M1124 495V570H267V482" marker-end="url(#g)"/><text class="t s" x="706" y="593" text-anchor="middle" fill="#16866a">关节位置 / 速度测量反馈</text></svg>
