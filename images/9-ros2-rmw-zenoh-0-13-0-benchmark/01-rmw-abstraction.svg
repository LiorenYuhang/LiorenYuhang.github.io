<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ROS 2 RMW 可替换中间件架构</title>
  <desc id="desc">同一 ROS 2 应用经 rclcpp、rcl、RMW，选择 rmw_fastrtps_cpp 对接 Fast DDS、rmw_cyclonedds_cpp 对接 Cyclone DDS，或 rmw_zenoh_cpp 对接 Zenoh。三个分支是替代方案，每次运行选择一个。</desc>
  <defs>
    <style>
      .t { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; fill: #202733; }
      .h { font-size: 26px; font-weight: 700; }
      .m { font-size: 22px; font-weight: 600; }
      .s { font-size: 16px; fill: #526071; }
      .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 20px; font-weight: 600; }
      .box { fill: #f8fafc; stroke: #3d4652; stroke-width: 2.2; }
      .accent { fill: #eef4ff; stroke: #2563eb; stroke-width: 2.4; }
      .line { stroke: #3d4652; stroke-width: 2.4; fill: none; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#3d4652"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <g class="t" text-anchor="middle">
    <text class="h" x="600" y="40">ROS 2 RMW：保留应用，选择通信实现</text>
    <rect class="box" x="375" y="76" width="450" height="66" rx="6"/>
    <text class="m" x="600" y="103">ROS 2 Application</text>
    <text class="s" x="600" y="127">同一套 Ping / Pong 源码、二进制与消息</text>
    <path class="line" d="M600 142V165" marker-end="url(#arrow)"/>
    <rect class="box" x="375" y="174" width="450" height="58" rx="6"/>
    <text class="m" x="600" y="211">rclcpp</text>
    <path class="line" d="M600 232V253" marker-end="url(#arrow)"/>
    <rect class="box" x="375" y="262" width="450" height="58" rx="6"/>
    <text class="m" x="600" y="299">rcl</text>
    <path class="line" d="M600 320V341" marker-end="url(#arrow)"/>
    <rect class="accent" x="375" y="350" width="450" height="66" rx="6"/>
    <text class="m" x="600" y="378">RMW</text>
    <text class="s" x="600" y="403">公共中间件接口 · 相同应用 QoS</text>
    <path class="line" d="M600 416V449M215 449H985M215 449V483M600 449V483M985 449V483"/>
    <path class="line" d="M215 475V483" marker-end="url(#arrow)"/>
    <path class="line" d="M600 475V483" marker-end="url(#arrow)"/>
    <path class="line" d="M985 475V483" marker-end="url(#arrow)"/>
    <rect class="accent" x="65" y="492" width="300" height="60" rx="6"/>
    <rect class="accent" x="450" y="492" width="300" height="60" rx="6"/>
    <rect class="accent" x="835" y="492" width="300" height="60" rx="6"/>
    <text class="code" x="215" y="529">rmw_fastrtps_cpp</text>
    <text class="code" x="600" y="529">rmw_cyclonedds_cpp</text>
    <text class="code" x="985" y="529">rmw_zenoh_cpp</text>
    <path class="line" d="M215 552V589" marker-end="url(#arrow)"/>
    <path class="line" d="M600 552V589" marker-end="url(#arrow)"/>
    <path class="line" d="M985 552V589" marker-end="url(#arrow)"/>
    <rect class="box" x="65" y="598" width="300" height="60" rx="6"/>
    <rect class="box" x="450" y="598" width="300" height="60" rx="6"/>
    <rect class="box" x="835" y="598" width="300" height="60" rx="6"/>
    <text class="m" x="215" y="635">Fast DDS</text>
    <text class="m" x="600" y="635">Cyclone DDS</text>
    <text class="m" x="985" y="635">Zenoh</text>
    <text class="s" x="600" y="704">RMW_IMPLEMENTATION 在启动前选择一个分支；三个分支不同时参与一次 run</text>
    <text class="s" x="600" y="732">概念架构图；不表示底层传输路径、SHM 或 router 的耗时分解</text>
  </g>
</svg>
